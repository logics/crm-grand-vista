# Verificação de todo pull request e de todo merge em `main`; no merge, também
# o deploy de produção. As etapas rodam em sequência e cada job para na primeira
# que falhar. O nome do job de verificação é o status obrigatório da proteção de
# `main`: renomeá-lo exige atualizar a regra junto, ou o merge fica bloqueado
# esperando um check que não existe mais.
#
# Deploy (só em push para `main`, depois da verificação verde): API primeiro —
# migration, artefato, reinício (`tools/deploy/deploy-api.sh`) —, front depois,
# para que ele nunca chame rota que a API no ar ainda não tem —, e por fim o
# E2E contra o ambiente publicado. Segredos e
# variáveis ficam no environment `production` do GitHub; o inventário e a
# rotação estão em `docs/deploy.md`.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um push novo no mesmo pull request torna a execução anterior irrelevante. Em
# `main` nunca se cancela: interromper um deploy entre a migration e o
# reinício deixaria produção num estado que ninguém escolheu.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verificação
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Histórico inteiro: a varredura de segredos lê todos os commits, não só o último.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Segredo que já entrou num commit continua no histórico mesmo apagado do
      # arquivo; por isso a varredura é do histórico. Exceções em `.gitleaks.toml`.
      # Binário fixado por versão e checksum, rodando direto no checkout.
      - name: Varredura de segredos
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner

      # Versão do pnpm vem do `packageManager` do package.json; a do Node, do `.nvmrc`.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Lockfile fora de sincronia com os package.json falha aqui, em vez de
      # produzir um build que ninguém reproduz.
      - name: Instalação (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Antes de subir o Postgres de propósito: prova que a suíte unitária não
      # depende de banco nem de container.
      - name: Testes unitários
        run: pnpm test

      # O mesmo docker-compose.yml do desenvolvimento: mesma tag exata do
      # Postgres (major 18, a de produção) e o mesmo init com os papéis
      # crm_owner e crm_app. Uma segunda cópia da tag aqui poderia divergir.
      - name: Postgres 18
        run: pnpm db:up

      # O setup global zera crm_test e aplica as migrations do zero; as
      # conexões vêm do `.env.test`, que aponta para o container acima.
      - name: Testes de integração
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      # Montado e verificado em todo pull request (sem teste, sem código-fonte,
      # sem dependência de desenvolvimento, sem `design-system/`), para que um
      # artefato inválido falhe aqui e não no deploy.
      - name: Artefato da API
        run: tools/deploy/build-api-artifact.sh "$RUNNER_TEMP/api" "$GITHUB_SHA"

      # tar preserva os links simbólicos do node_modules do pnpm, que o
      # upload-artifact sozinho perderia.
      - name: Empacotar o artefato da API
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tar -czf "$RUNNER_TEMP/api.tar.gz" -C "$RUNNER_TEMP" api

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: api
          path: ${{ runner.temp }}/api.tar.gz
          retention-days: 30

      # Prova que a vitrine do Design System compila com as stories de cada
      # componente; o render de cada story já foi exercitado nos testes unitários.
      - name: Storybook
        run: pnpm --filter @crm/ui build-storybook

  deploy-api:
    name: Deploy da API
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7

      # A migration roda a partir do próprio artefato, no Node do `.nvmrc`.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v8
        with:
          name: api
          path: ${{ runner.temp }}

      - name: Extrair o artefato
        run: tar -xzf "$RUNNER_TEMP/api.tar.gz" -C "$RUNNER_TEMP"

      # A chave fica num arquivo só do runner; o known_hosts vem fixado na
      # variável, nunca aceito na primeira conexão.
      - name: Chave SSH de deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host *
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            Port $DEPLOY_SSH_PORT
          CONFIG

      - name: Migration, envio do artefato e reinício
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/api
          RELEASE: ${{ github.sha }}
          DEPLOY_SSH_TARGET: ${{ vars.DEPLOY_SSH_TARGET }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          HEALTH_URL: ${{ vars.API_HEALTH_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: tools/deploy/deploy-api.sh

  deploy-web:
    name: Deploy do front
    needs: deploy-api
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # O CLI roda o build do `netlify.toml` aqui no runner, com as variáveis de
      # build lidas do painel do Netlify, e publica o resultado em produção.
      # `--dir` absoluto: com `--filter`, o deploy resolve o `publish` do
      # `netlify.toml` a partir da raiz do repositório, e não de `apps/web`.
      - name: Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: >-
          npx --yes netlify-cli@27.10.2 deploy
          --prod --context production --filter @crm/web --site "$NETLIFY_SITE_ID"
          --dir "$GITHUB_WORKSPACE/apps/web/dist"

  # O "hello world" autenticado contra o ambiente publicado, não contra o local:
  # login, empresa resolvida pelo slug, usuário e empresa na tela, logout. Roda
  # com a conta de verificação, numa empresa própria (`docs/deploy.md`). Falhar
  # aqui não desfaz o deploy — avisa que produção, já no ar, não está de pé.
  e2e-production:
    name: E2E em produção
    needs: deploy-web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalação (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Navegador do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright contra produção
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_USER_NAME: ${{ vars.E2E_USER_NAME }}
          E2E_USER_EMAIL: ${{ vars.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_TENANT_SLUG: ${{ vars.E2E_TENANT_SLUG }}
          E2E_TENANT_NAME: ${{ vars.E2E_TENANT_NAME }}
        run: pnpm test:e2e:production

      # O trace mostra a tela em cada passo; só sai quando algo falhou.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-production
          path: test-results/
          retention-days: 14
