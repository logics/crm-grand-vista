<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Grand Vista Fazendas</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../data.js"></script>
<style>body{margin:0;background:var(--surface-card)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="SiteChrome.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="ListingScreen.jsx"></script>
<script type="text/babel" src="PropertyScreen.jsx"></script>
<script type="text/babel" data-presets="react">
const { Toast } = window.GrandVistaDesignSystem_6745fe;

function Site() {
  const [page, setPage] = React.useState('home');
  const [farm, setFarm] = React.useState(null);
  const [toast, setToast] = React.useState(false);
  const open = (f) => { setFarm(f); setPage('imovel'); window.scrollTo(0, 0); };
  const go = (p) => { setPage(p === 'home' ? 'home' : 'listagem'); window.scrollTo(0, 0); };
  const submit = () => { setToast(true); setTimeout(() => setToast(false), 4200); };
  return (
    <div style={{ position: 'relative', minHeight: '100vh' }}>
      <window.SiteHeader page={page === 'imovel' ? 'listagem' : page} onNavigate={go} />
      {page === 'home' && <window.HomeScreen onOpenProperty={open} onSearch={() => go('listagem')} />}
      {page === 'listagem' && <window.ListingScreen onOpenProperty={open} />}
      {page === 'imovel' && <window.PropertyScreen farm={farm} onOpenProperty={open} onSubmit={submit} />}
      <window.SiteFooter />
      {toast && <div style={{ position: 'fixed', right: 24, bottom: 24, zIndex: 60 }}>
        <Toast title="Contato enviado" message="Um corretor responde em até 1 dia útil com a ficha completa." onClose={() => setToast(false)} />
      </div>}
    </div>
  );
}

const start = () => {
  if (!window.SiteHeader || !window.HomeScreen || !window.PropertyScreen || !window.ListingScreen) return setTimeout(start, 60);
  ReactDOM.createRoot(document.getElementById('root')).render(<Site />);
};
start();
</script>
</body></html>
