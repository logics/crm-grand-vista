<!-- @dsCard group="Spacing" viewport="700x140" name="Movimento" subtitle="80 / 140 / 220 / 360ms com easing padrão — sem bounce" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-card);font-family:var(--font-sans)}.row{display:flex;gap:10px}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-faint)}.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}</style>
</head><body><div style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;gap:12px"><span style="width:56px;font-size:11px;color:var(--text-body)">instant</span><span class="mono" style="width:48px">80ms</span><div style="flex:1;height:6px;background:var(--gv-ink-100);border-radius:var(--radius-pill);overflow:hidden"><div style="height:100%;background:var(--gv-gold-500);border-radius:var(--radius-pill);animation:g 80ms var(--ease-standard) infinite alternate"></div></div></div><div style="display:flex;align-items:center;gap:12px"><span style="width:56px;font-size:11px;color:var(--text-body)">fast</span><span class="mono" style="width:48px">140ms</span><div style="flex:1;height:6px;background:var(--gv-ink-100);border-radius:var(--radius-pill);overflow:hidden"><div style="height:100%;background:var(--gv-gold-500);border-radius:var(--radius-pill);animation:g 140ms var(--ease-standard) infinite alternate"></div></div></div><div style="display:flex;align-items:center;gap:12px"><span style="width:56px;font-size:11px;color:var(--text-body)">normal</span><span class="mono" style="width:48px">220ms</span><div style="flex:1;height:6px;background:var(--gv-ink-100);border-radius:var(--radius-pill);overflow:hidden"><div style="height:100%;background:var(--gv-gold-500);border-radius:var(--radius-pill);animation:g 220ms var(--ease-standard) infinite alternate"></div></div></div><div style="display:flex;align-items:center;gap:12px"><span style="width:56px;font-size:11px;color:var(--text-body)">slow</span><span class="mono" style="width:48px">360ms</span><div style="flex:1;height:6px;background:var(--gv-ink-100);border-radius:var(--radius-pill);overflow:hidden"><div style="height:100%;background:var(--gv-gold-500);border-radius:var(--radius-pill);animation:g 360ms var(--ease-standard) infinite alternate"></div></div></div>
<div class="mono">--ease-standard cubic-bezier(.2,.6,.25,1)</div></div>
<style>@keyframes g{from{width:8%}to{width:100%}}</style></body></html>
