<!-- @dsCard group="Colors" viewport="700x170" name="Superfícies" subtitle="Canvas pedra, cards brancos flutuantes, faixas rebaixadas e hero" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}.row{display:flex;gap:10px}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-faint)}.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}</style>
</head><body><div style="padding:14px;background:var(--surface-page);border-radius:var(--radius-card);display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
<div style="height:104px;border-radius:var(--radius-md);background:var(--surface-card);box-shadow:var(--shadow-sm);display:flex;align-items:flex-end;padding:10px;font-size:11px;color:var(--text-faint)">card</div><div style="height:104px;border-radius:var(--radius-md);background:var(--surface-sunken);box-shadow:none;display:flex;align-items:flex-end;padding:10px;font-size:11px;color:var(--text-faint)">sunken</div><div style="height:104px;border-radius:var(--radius-md);background:var(--surface-muted);box-shadow:none;display:flex;align-items:flex-end;padding:10px;font-size:11px;color:var(--text-faint)">muted</div><div style="height:104px;border-radius:var(--radius-md);background:var(--surface-selected);box-shadow:none;display:flex;align-items:flex-end;padding:10px;font-size:11px;color:var(--brand-primary)">selected</div><div style="height:104px;border-radius:var(--radius-md);background:var(--surface-inverse);box-shadow:none;display:flex;align-items:flex-end;padding:10px;font-size:11px;color:rgba(255,255,255,.7)">inverse</div>
</div><div class="mono" style="margin-top:8px">fundo da página = --surface-page (#F2F1EC) · hero = --gradient-hero</div></body></html>
