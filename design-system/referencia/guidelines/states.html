<!-- @dsCard group="Spacing" viewport="700x150" name="Estados de interação" subtitle="Repouso, hover, pressionado, foco dourado e desabilitado" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-body)}.row{display:flex;gap:10px}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-faint)}.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}</style>
</head><body><div class="row" style="align-items:center;gap:14px;flex-wrap:wrap">
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="height:40px;padding:0 16px;display:grid;place-items:center;background:var(--brand-primary);color:#fff;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-primary);">Repouso</div><div class="mono">green-700</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="height:40px;padding:0 16px;display:grid;place-items:center;background:var(--brand-primary-hover);color:#fff;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-primary);">Hover</div><div class="mono">green-800</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="height:40px;padding:0 16px;display:grid;place-items:center;background:var(--brand-primary-active);color:#fff;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:none;transform:translateY(1px);">Pressionado</div><div class="mono">+1px Y</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="height:40px;padding:0 16px;display:grid;place-items:center;background:var(--brand-primary);color:#fff;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:var(--ring-focus);">Foco</div><div class="mono">ring-focus</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="height:40px;padding:0 16px;display:grid;place-items:center;background:var(--brand-primary);color:#fff;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:none;opacity:.45;">Desabilitado</div><div class="mono">opacity .45</div></div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="height:40px;width:150px;display:flex;align-items:center;padding:0 12px;background:var(--surface-card);border-radius:12px;box-shadow:inset 0 0 0 1px var(--brand-accent),var(--ring-focus);font-size:13px;color:var(--text-faint)">Campo em foco</div><div class="mono">input · focus</div></div>
</div></body></html>
